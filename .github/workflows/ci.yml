name: CI

on:
  push:
  pull_request:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  local-gate:
    name: ${{ matrix.os }} / Python ${{ matrix.python-version }}
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os:
          - ubuntu-latest
          - macos-latest
          - windows-latest
        python-version:
          - "3.11"
          - "3.12"
          - "3.13"
          - "3.14"

    steps:
      - name: Check out repository
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v7
        with:
          python-version: ${{ matrix.python-version }}

      - name: Install test dependencies
        run: |
          python -m pip install --upgrade pip setuptools wheel
          python -m pip install -e ".[dev]"

      - name: Run tests
        run: python -m pytest -q

      - name: Compile Python files
        run: python -m compileall improvement_guru tests scripts

      - name: Run release smoke check
        run: python scripts/release_check.py --install-smoke

      - name: Check source URL list
        run: python scripts/check_sources.py --dry-run

      - name: Check Windows README start from an empty folder
        if: runner.os == 'Windows' && matrix.python-version == '3.14'
        shell: pwsh
        run: |
          $PSNativeCommandUseErrorActionPreference = $true
          Set-Location (New-Item -ItemType Directory -Path "$env:RUNNER_TEMP/readme-start")
          py -m venv .venv
          .venv\Scripts\python -m pip install "$env:GITHUB_WORKSPACE"
          .venv\Scripts\improvement-guru new my_audit --profile uk
          .venv\Scripts\improvement-guru sources show uk
          if ((Get-ChildItem my_audit -File).Count -ne 9) { throw "Expected nine scaffold files" }
