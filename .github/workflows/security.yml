name: Security

on:
  push:
    branches: [main]
  pull_request:
  schedule:
    - cron: "17 6 * * 1"
  workflow_dispatch:

permissions:
  contents: read

jobs:
  scans:
    name: Secret, code and dependency scans
    runs-on: ubuntu-latest
    steps:
      - name: Check out repository
        uses: actions/checkout@v7
        with:
          fetch-depth: 0

      - name: Scan history for secrets
        uses: gitleaks/gitleaks-action@v2
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: "3.13"

      - name: Install scanners and the package
        run: |
          python -m pip install --upgrade pip
          python -m pip install -e ".[dev]" bandit pip-audit

      - name: Static security scan of the engine
        run: python -m bandit -r improvement_guru -q

      - name: Audit installed dependencies
        run: python -m pip_audit --skip-editable
